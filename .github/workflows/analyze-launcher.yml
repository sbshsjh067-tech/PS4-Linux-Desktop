name: Analyse the shipped launcher (crash investigation)

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/analyze-launcher.yml"
      - "scripts/analyze_self.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN: "43642717115"

jobs:
  analyse:
    name: Dissect eboot.bin + control sample
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download the shipped boot assets
        uses: actions/download-artifact@v4
        with:
          name: ps4-linux-desktop-boot-assets
          path: in
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate and dissect the shipped SELF files
        run: |
          set -uo pipefail
          echo "::notice title=tree::$(find in -type f -printf '%P %s | ' | head -c 900)"
          FILES=""
          for want in eboot.bin libc.prx libSceFios2.prx right.sprx; do
            hit="$(find in -type f -name "$want" | head -1)"
            if [ -n "$hit" ]; then FILES="$FILES $hit"; else echo "::warning title=missing::$want not in the artifact"; fi
          done
          echo "::notice title=analysed-files::${FILES}"
          python3 scripts/analyze_self.py $FILES || echo "::warning title=analyzer::non-zero exit"

      - name: Fetch toolchain and upstream sources
        run: |
          set -uo pipefail
          curl -fL --retry 3 -o /tmp/tc.tar.gz \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
          rc=$?
          echo "::notice title=toolchain-download::rc=$rc size=$(stat -c %s /tmp/tc.tar.gz 2>/dev/null || echo none)"
          mkdir -p /tmp/tc && tar -xzf /tmp/tc.tar.gz -C /tmp/tc 2>/dev/null
          linkx="$(find /tmp/tc -maxdepth 8 -name link.x -print -quit)"
          echo "::notice title=linkx::${linkx:-NOT-FOUND}"
          if [ -n "$linkx" ]; then echo "TC=$(dirname "$linkx")" >> "$GITHUB_ENV"; fi
          git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/oo && \
            echo "::notice title=clone::ok" || echo "::notice title=clone::failed"

      - name: Toolchain internals (entry symbol, crt)
        run: |
          set -uo pipefail
          TC="${TC:-}"
          echo "::notice title=tc::${TC:-unset}"
          if [ -n "$TC" ]; then
            echo "::notice title=linkx-entry::$(grep -n -i 'ENTRY' "$TC/link.x" | head -3 | tr '\n' ' ')"
            echo "::notice title=crt1-nm::$( (llvm-nm "$TC/lib/crt1.o" 2>/dev/null || nm "$TC/lib/crt1.o" 2>/dev/null || echo 'nm unavailable') | head -12 | tr '\n' ' ')"
            echo "::notice title=libdir::$(ls "$TC/lib" 2>/dev/null | tr '\n' ' ' | head -c 700)"
          fi

      - name: Build the upstream control sample
        run: |
          set -uo pipefail
          if [ -z "${TC:-}" ] || [ ! -d /tmp/oo/samples/hello_world ]; then
            echo "::warning title=control::skipped (no toolchain or no samples)"; exit 0
          fi
          cd /tmp/oo/samples/hello_world
          OO_PS4_TOOLCHAIN="$TC" make eboot.bin > /tmp/control-build.log 2>&1
          rc=$?
          echo "::notice title=control-build::rc=$rc size=$(stat -c %s eboot.bin 2>/dev/null || echo none)"
          echo "::notice title=control-build-tail::$(tail -6 /tmp/control-build.log | tr '\n' ' ' | head -c 800)"
          if [ -f eboot.bin ]; then cp eboot.bin "$GITHUB_WORKSPACE/in/control-hello-world-eboot.bin"; fi

      - name: Dissect the control sample
        run: |
          set -uo pipefail
          if [ -f in/control-hello-world-eboot.bin ]; then
            python3 scripts/analyze_self.py in/control-hello-world-eboot.bin
          else
            echo "::warning title=control::no control eboot.bin produced"
          fi

      - name: Upload the analysis inputs for the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-analysis-inputs
          retention-days: 7
          path: in
          if-no-files-found: warn
