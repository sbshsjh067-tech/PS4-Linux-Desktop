name: External Build — packaging diagnosis (reuses an existing bzImage)

# Temporary diagnostic workflow: reruns toolchain -> orbis -> rootfs -> pkg ->
# verify against the bzImage artifact of an earlier run, so a packaging failure
# can be pinpointed in minutes instead of rebuilding the kernel first.
#
# It never uploads anything. Triggered by pushing a change to this file.
# Revision: 3 (pkg stage diagnostics: .NET roll-forward + tool probe + full stderr).

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/external-pkg-diagnose.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  KERNEL_RUN_ID: "43631659314"

jobs:
  diagnose:
    name: Rebuild packaging stages only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates clang lld llvm bc flex bison \
            libssl-dev libelf-dev libncurses-dev dwarves zstd xz-utils cpio kmod \
            python3 e2fsprogs debootstrap util-linux file binutils openssl
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dotnet-sdk-8.0 \
            || echo "dotnet unavailable"

      - name: Fetch boot assets from the earlier run
        uses: actions/download-artifact@v4
        with:
          name: ps4-linux-desktop-boot-assets
          path: artifacts/external
          run-id: ${{ env.KERNEL_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what was reused
        run: find artifacts/external -type f -printf '%10s  %p\n' | sort -k2

      - name: "Stage 1 — toolchain"
        run: sudo -E ./scripts/build-external-release.sh --stages toolchain

      - name: "Stage 3 — reuse bzImage"
        run: sudo -E ./scripts/build-external-release.sh --stages kernel --skip-kernel --bzimage artifacts/external/kernel/bzImage

      - name: "Stage 4 — orbis modules + launcher"
        run: sudo -E ./scripts/build-external-release.sh --stages orbis

      - name: "Stage 5 — rootfs"
        run: sudo -E ./scripts/build-external-release.sh --stages rootfs --rootfs-size 4G --rootfs-profile minimal

      - name: "Stage 6 — package"
        run: sudo -E ./scripts/build-external-release.sh --stages pkg --no-upload

      - name: "Stage 7 — verify"
        run: sudo -E ./scripts/build-external-release.sh --stages verify

      - name: Diagnose failure (publish log tail as annotation)
        if: failure()
        run: |
          chmod +x scripts/ci_failure_annotations.py
          python3 scripts/ci_failure_annotations.py artifacts/external/build.log \
            | tee -a "$GITHUB_STEP_SUMMARY"
