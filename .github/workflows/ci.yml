name: PS4 Linux Desktop CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Build Jaguar-targeted C initramfs guard & verify zero AVX2 instructions
        run: |
          make build-initramfs-guard
          AVX2_HITS=$(objdump -d initramfs/bin/ps4_hdmi_guard | grep -c -E '\b(vpbroadcast|vperm2i128|vpaddd.*%ymm|vfmadd|mulx|pdep|pext)\b' || true)
          test "$AVX2_HITS" -eq 0

      - name: Verify mirrored PS4 Mesa patch SHA-256 hashes
        run: make verify-patches

      - name: Lint Bash & Python scripts
        run: make lint

      - name: Run Automated Test Suite (TEST A through TEST M)
        run: pytest -v tests/
