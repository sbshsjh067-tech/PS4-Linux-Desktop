name: Probe tmpfiles.org URL forms

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/probe-tmpfiles.yml"
      - "scripts/probe_url.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set -euo pipefail
          ID=wPAk7YhBp8WR
          NAME=iv0000-brew00001_00-ps4ldesktop00000.pkg
          python3 scripts/probe_url.py \
            "https://tmpfiles.org/${ID}/${NAME}" \
            "https://tmpfiles.org/dl/${ID}/${NAME}" \
            "https://tmpfiles.org/dl/${ID}/${NAME}?download=1"
