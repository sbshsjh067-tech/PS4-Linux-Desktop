# Example console profile. Copy to profile.yaml and fill it in BEFORE any experiment.
# Everything in `profile.yaml` is machine-readable by the doctor/tooling (T-001).

console:
  model: "CUH-1216A"            # exact model plate on the console
  family: fat                    # fat | slim | pro
  southbridge: belize            # aeolia | belize | baikal  (check Settings > System Information / scene tools)
  wifi_bt_chip: marvell_88w8897  # marvell_88w8797 | marvell_88w8897 | mediatek_mt7668 | unknown
  region: EU                     # region of the unit
  purchased: 2015

firmware:
  version: "13.52"               # FROZEN — never update while using this profile
  jailbreak: goldhen             # goldhen | ps4hen | none
  goldhen_version: "2.4b18.12"
  payload_host: browser          # browser | pc_served | phone
  notes: "14.00+ would be rough; do not update."

boot:
  loader_commit: "REPLACE_WITH_SHA"
  loader_asset: linux-1024mb.elf
  kernel: "7.1.7-belize"          # or 7.0.8-baikal etc.
  kernel_commit: "REPLACE_WITH_SHA"
  initramfs: "initramfs.cpio.gz"
  vram_mb: 1024
  bootargs_extra: ""              # e.g. "amdgpu.dpm=1" for EXP-005
  usb:
    device: "Samsung FIT Plus 64GB"
    iface: usb3
    label: PS4KD

software:
  distro: "Arch (KDE)"            # or Debian 13 / Ubuntu 24.04 / ...
  mesa: "25.3.5"                  # pinned PS4 build
  mesa_path: /opt/ps4-mesa/25.3.5
  dxvk: "2.7.1"
  proton: "11.0"
  plasma: "6.x"
  session: x11                    # x11 | wayland

hardware_checks:
  avx2_present: false             # MUST be false
  gpu_pci_id: "1002:9923"         # lspci
  renderer: "AMD LIVERPOOL"       # glxinfo -B
  vulkan_api: "1.3.xxx"           # vulkaninfo --summary
  ram_total_gb: 6.7               # free -h (after carve-out)
  root_device: "/dev/sda2"        # must be USB
  temp_idle_c: 52
  fan_control: "/dev/icc"         # or "hwmon" / "missing"

results_refs:
  - "results/EXP-001/2026-11-20/"
  - "results/EXP-002/2026-11-21/"
