# PS4 Linux Desktop — Application Defaults for 8x AMD Jaguar + GFX7 Vulkan 1.3 (Ticket T-015)

## 1. Firefox (`user.js` overrides)
# Caps IPC content processes to 2 for 6.5 GiB RAM budget; disables broken VA-API (Mesa built with -Dgallium-va=disabled)
user_pref("dom.ipc.processCount", 2);
user_pref("media.ffmpeg.vaapi.enabled", false);
user_pref("media.av1.enabled", false);
user_pref("gfx.x11-egl.force-enabled", true);
user_pref("toolkit.telemetry.enabled", false);

## 2. Steam & Proton Launch Profile (GFX-002, GFX-004, APP-001)
# Mandatory: Proton <= 11.0 (bundles DXVK 2.7.1, Vulkan 1.3). NEVER use DXVK 3.x (requires Vulkan 1.4).
STEAM_COMPAT_TOOL_PATHS="/opt/ps4-proton/Proton-11.0"
DXVK_MAX_VERSION="2.7.1"
STEAM_SAFE_LAUNCH_OPTIONS="-force-d3d11 -windowed -w 1280 -h 720"
STEAM_OPENGL_FALLBACK="PROTON_USE_WINED3D=1 %command% -force-d3d11"

## 3. Dolphin Emulator (`GFX.ini` / `Dolphin.ini` for PS4 Liverpool)
# Vulkan RADV backend, Asynchronous Ubershaders, Auto CPU Clock + Auto 60/30 FPS limit
DOLPHIN_GFX_BACKEND="Vulkan"
DOLPHIN_SHADER_COMPILATION_MODE="2"
DOLPHIN_CPU_CLOCK_OVERRIDE="Auto"

## 4. VLC / mpv (1080p30 H.264 Software Decode)
MPV_FLAGS="--vo=gpu --hwdec=no"
VLC_FLAGS="--avcodec-hw=none"
