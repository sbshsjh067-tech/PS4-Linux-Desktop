# PS4 Linux Desktop — System RAM / zram / USB Write-Amplification Tuning (T-010, D-01, D-04)
#
# Target: ~7 GiB usable Linux RAM after 1024 MiB VRAM carve-out on PS4 Fat (8 GiB unified GDDR5)
# Purpose:
#   1. Prevent OOM freezes during KDE Plasma + Firefox + Steam (`DSK-004`).
#   2. Prevent USB flash wear & I/O stalls (`USB-002`) by avoiding uncompressed USB swap
#      and routing journald to bounded volatile RAM.

# --- 1. /etc/systemd/zram-generator.conf ---
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap

# --- 2. /etc/sysctl.d/90-ps4-memory-usb.conf ---
# Prefer compressed GDDR5 zram swap; prevent dirty writeback spikes to USB 3.0 storage
# vm.swappiness = 100
# vm.page-cluster = 0
# vm.dirty_bytes = 67108864
# vm.dirty_background_bytes = 16777216
# vm.vfs_cache_pressure = 50

# --- 3. /etc/systemd/journald.conf.d/90-ps4-volatile.conf ---
# [Journal]
# Storage=volatile
# RuntimeMaxUse=64M
# ForwardToSyslog=no

# --- 4. /etc/fstab USB Root & Host Reference (D-01: Internal PS4 HDD NEVER listed here) ---
# LABEL=PS4LINUX  /       ext4  rw,noatime,nodiratime,commit=30,errors=remount-ro  0 1
# LABEL=PS4BOOT   /boot   vfat  rw,noatime,fmask=0022,dmask=0022                   0 2
